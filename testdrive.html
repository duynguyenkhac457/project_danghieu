<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đặt lịch lái thử | Porsche</title><link rel="stylesheet" href="style.css"></head><body>
<header class="site-header"><a class="logo" href="index.html">PORSCHE</a><nav class="main-nav"><a href="index.html#models">Các dòng xe</a><a href="history.html">Lịch sử mua</a></nav></header>
<main class="page-wrap"><div class="page-title"><p class="eyebrow">TEST DRIVE</p><h1>Đặt lịch lái thử</h1><p>Điền thông tin và chọn thời gian phù hợp để gửi yêu cầu lái thử.</p></div><section class="panel"><form id="testDriveForm" class="form-two">
<div class="field"><label>Họ và tên *</label><input name="customerName" required></div><div class="field"><label>Số điện thoại *</label><input name="phone" type="tel" pattern="[0-9+ .-]{9,15}" required></div>
<div class="field"><label>Email *</label><input name="email" type="email" required></div><div class="field"><label>Dòng xe muốn lái thử *</label><select name="car" required><option value="">Chọn dòng xe</option><option>Porsche 911</option><option>Porsche Taycan</option><option>Porsche Cayenne</option><option>Porsche Macan</option><option>Porsche Panamera</option><option>Porsche 718</option></select></div>
<div class="field"><label>Ngày lái thử *</label><input name="date" type="date" required></div><div class="field"><label>Giờ lái thử *</label><input name="time" type="time" required></div>
<div class="field span-two"><label>Ghi chú</label><textarea name="note" placeholder="Yêu cầu thêm (không bắt buộc)"></textarea></div><div class="span-two"><button class="button button-dark">GỬI YÊU CẦU ĐẶT LỊCH</button><p class="small-note">Đây là chức năng demo, lịch được lưu trên trình duyệt và chưa gửi tới đại lý.</p></div></form></section></main><script src="script.js"></script></body></html>
